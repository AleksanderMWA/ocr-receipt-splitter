<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OCR expense Splitter</title>
        <link rel="icon" type="image/png" href="/assets/icon.png">
        
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
        
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="/css/styles.css">
        <script src="/js/db.js" defer></script>
        <script src="/js/config.js"></script>
        <script src="/js/expense.js"></script>
    </head>

    <body>

        <div class="modal fade" id="receiptUploadModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header border-0">
                        <h5 class="modal-title">
                            Upload new receipt
                        </h5>
                    </div>

                    <div class="modal-body pt-4">
                        <label for="receiptName" class="form-label">Receipt name</label>
                        <input type="text" id="receiptName" name="receiptName"
                        class="form-control custom-input"
                        placeholder="Enter receipt name" required>
                        <div class="invalid-feedback">
                            Please enter a receipt name.
                        </div>
                    </div>                     


                    <div class="modal-body d-flex flex-wrap justify-content-center gap-3"
                         id="receiptUploadOptions">
                        <button type="button" class="btn btn-dark py-2 rounded-3"
                                id="receiptUploadTabScannerButton">
                            Using TabScanner OCR tool
                        </button>

                        <button type="button" class="btn btn-secondary"
                                id="receiptUploadLocalUploadButton">
                            Locally
                        </button>

                        <input type="file"
                            id="receiptFileInput"
                            accept=".jpg,.jpeg,.png"
                            hidden>
                        <div id="receiptFileFeedback" class="text-danger small w-100 text-center" role="alert" hidden></div>
                    </div>

                    <div class="modal-body text-center" id="receiptScannerLoading" hidden
                         aria-live="polite">
                        <div class="spinner-border text-dark mb-3" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mb-0">Uploading and scanning the receipt...</p>
                    </div>

                </div>
            </div>
        </div>




        <div class="expense-workspace">  

            <div class="expense-content">        

                <div class="expense-panel">

                    <h1 class="expense-title" id="expenseTitle">
                        Waiting for the receipt name...
                    </h1>


                    <div class="expense-payer-section">
                        <label for="expenseSelectPayer" class="form-label">
                            Payer:
                        </label>

                        <select
                            class="form-select"
                            id="expenseSelectPayer"
                            name="expenseSelectPayer">
                        </select>
                    </div>

                    
                    
                    <div class="expense-line-items-container overflow-y-auto">

                        <div class="expense-line-items-list" id="expenseLineItemsList"></div>

                        <button class="btn btn-outline-secondary add-expense"
                            id="expenseCreateButton" type="button"
                            aria-label="Add receipt" title="Add receipt">
                            +
                        </button>
                    </div>
                    

                </div>
                
                <div class="expense-image-container" id="expenseImageContainer">

                </div>

            </div>

            
            <div class="expense-toolbar">

                <button class="btn btn-outline-secondary"
                        type="button" aria-label="Return" id="returnToIndexButton">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-chevron-left" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
                        </svg>
                                        
                </button>

                <div class="toolbar-spacer"></div>

                
                <button class="btn btn-outline-secondary"
                        type="button" aria-label="Delete" id="receiptDelete">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                        <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
                    </svg>
                </button>


                <button class="btn btn-outline-secondary"
                        type="button" aria-label="View expenses" id="receiptSwitchButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-card-list" viewBox="0 0 16 16">
                        <path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2z"/>
                        <path d="M5 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 5 8m0-2.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m0 5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m-1-5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0M4 8a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m0 2.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0"/>
                    </svg>            
                </button>

                <button class="btn btn-outline-secondary"
                        type="button" aria-label="Add receipt" id="receiptUploadNew">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-file-earmark-plus" viewBox="0 0 16 16">
                        <path d="M8 6.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V11a.5.5 0 0 1-1 0V9.5H6a.5.5 0 0 1 0-1h1.5V7a.5.5 0 0 1 .5-.5"/>
                        <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z"/>
                    </svg>            
                </button>

                <button class="btn btn-dark" type="button" id="expenseGetSummaryButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-table" viewBox="0 0 16 16">
                        <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 2h-4v3h4zm0 4h-4v3h4zm0 4h-4v3h3a1 1 0 0 0 1-1zm-5 3v-3H6v3zm-5 0v-3H1v2a1 1 0 0 0 1 1zm-4-4h4V8H1zm0-4h4V4H1zm5-3v3h4V4zm4 4H6v3h4z"/>
                    </svg>
                </button>        

            </div>

        </div>
     
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
